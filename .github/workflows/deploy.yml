name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez. Si llega uno nuevo, cancela el anterior en curso.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Versión ÚNICA por commit inyectada en los 3 sitios (sw.js CACHE,
      # version.json build, index.html BUILD) → cache-busting + aviso de "versión
      # nueva" automáticos, sin bumps a mano. Falla el deploy si queda placeholder.
      - name: Inyectar versión de build
        run: |
          VER="qrclapper-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          echo "Versión de build: $VER"
          sed -i "s/__BUILD__/$VER/g" sw.js version.json index.html
          if grep -q "__BUILD__" sw.js version.json index.html; then
            echo "ERROR: quedó __BUILD__ sin sustituir"; exit 1
          fi
          echo "version.json →"; cat version.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # Reintenta el despliegue si GitHub Pages devuelve el fallo transitorio
      # "Deployment failed, try again later." (hasta 3 intentos, 15s entre ellos).
      - name: Deploy to GitHub Pages (con reintentos)
        id: deployment
        uses: Wandalen/wretry.action@v3
        with:
          action: actions/deploy-pages@v4
          attempt_limit: 3
          attempt_delay: 15000
